name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Ubuntu Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple clang
            os: macos-latest
            cc: cc
            cxx: c++
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test (the oracle suites that pass so far)
        run: ctest --test-dir build --build-config Release --output-on-failure

  swift:
    name: Swift package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  lint:
    name: clang-format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-format clang-tidy
      - name: clang-format
        run: clang-format --dry-run --Werror include/libseq/*.hpp include/libseq/*.h src/*.cpp src/*.hpp tests/runner/*.cpp tests/runner/*.hpp tests/c/*.c tests/cpp/*.cpp
      - name: Configure with compile commands
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        env:
          CC: clang
          CXX: clang++
      - name: clang-tidy
        run: clang-tidy -p build --warnings-as-errors='*' src/*.cpp tests/runner/*.cpp
